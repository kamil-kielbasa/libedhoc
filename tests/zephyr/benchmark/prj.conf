# =============================================================================
# EDHOC handshake benchmark (ZTEST) — base configuration.
#
# Base build benchmarks the classic suites with the stack memory backend; the
# post-quantum suite and the heap / custom backends are layered on via overlays
# (see overlays/ and testcase.yaml).
# =============================================================================

# --- libedhoc ----------------------------------------------------------------
CONFIG_LIBEDHOC_ENABLE=y
CONFIG_LIBEDHOC_LOG_LEVEL_NONE=y

# Buffer floors sized for the largest enabled suite: P-384 needs a 48-byte NIKE
# key (97-byte uncompressed point) and the post-quantum suite an 800-byte KEM
# encapsulation key / 768-byte ciphertext / 64-byte MAC.
CONFIG_LIBEDHOC_MAX_LEN_OF_KEM_ENCAPSULATION_KEY=800
CONFIG_LIBEDHOC_MAX_LEN_OF_KEM_CIPHERTEXT=768
CONFIG_LIBEDHOC_MAX_LEN_OF_NIKE_KEY=97
CONFIG_LIBEDHOC_MAX_LEN_OF_MAC=64

# Suite selection: every cipher suite with integration test vectors — 0
# (X25519), 2 (P-256), 24 (P-384) and pqc_1 (ML-KEM-512 / ML-DSA-44). Suite 4
# has no test vectors, so it stays off.
CONFIG_LIBEDHOC_CIPHER_SUITE_0_ENABLE=y
CONFIG_LIBEDHOC_CIPHER_SUITE_2_ENABLE=y
CONFIG_LIBEDHOC_CIPHER_SUITE_4_ENABLE=n
CONFIG_LIBEDHOC_CIPHER_SUITE_24_ENABLE=y
CONFIG_LIBEDHOC_CIPHER_SUITE_PQC_1_ENABLE=y

# --- Test framework ----------------------------------------------------------
CONFIG_ZTEST=y

# --- mbedTLS / PSA crypto ----------------------------------------------------
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# PSA crypto for the classic suites:
#   suite 0  — X25519 / EdDSA / AES-CCM-16-64-128 / SHA-256
#   suite 2  — P-256  / ES256 / AES-CCM-16-64-128 / SHA-256
#   suite 24 — P-384  / ES384 / A256GCM          / SHA-384
# Ed25519 signing uses compact25519 (built by libedhoc's Zephyr module) over a
# RAW_DATA seed key.
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_RAW_DATA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ALG_HKDF_EXTRACT=y
CONFIG_PSA_WANT_ALG_HKDF_EXPAND=y
CONFIG_PSA_WANT_ALG_HMAC=y

# Each handshake uses ~10 key slots; PSA is reset per handshake, but keep head-
# room for the largest working set.
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=128

# --- Post-quantum suite pqc_1 (liboqs) ---------------------------------------
# ML-KEM-512 and ML-DSA-44; XKCP's KMAC256 KDF is built by libedhoc's module.
CONFIG_LIBOQS=y
CONFIG_LIBOQS_ENABLE_KEM_ML_KEM=y
CONFIG_LIBOQS_ENABLE_SIG_ML_DSA=y

# --- Stacks ------------------------------------------------------------------
# The 16 KiB message buffer and the two EDHOC contexts live on the test thread
# stack, on top of the deep stack PSA / mbedTLS use during P-384 / PQC
# operations; native_sim runs on the host, so the generous size is free.
CONFIG_MAIN_STACK_SIZE=65536
CONFIG_ZTEST_STACK_SIZE=65536
