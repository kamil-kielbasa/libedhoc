# EDHOC handshake benchmark (ZTEST) — common base. Each scenario adds one cipher
# suite (overlays/cipher_suite_*.conf) and one memory backend overlay
# (overlays/memory_backend_*.conf); see testcase.yaml.

# --- libedhoc ----------------------------------------------------------------
CONFIG_LIBEDHOC_ENABLE=y
CONFIG_LIBEDHOC_LOG_LEVEL_NONE=y

# --- Test framework ----------------------------------------------------------
CONFIG_ZTEST=y

# --- mbedTLS / PSA crypto ----------------------------------------------------
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=128

# --- Stacks ------------------------------------------------------------------
# Message buffer + the two EDHOC contexts live on the test thread stack.
CONFIG_MAIN_STACK_SIZE=65536
CONFIG_ZTEST_STACK_SIZE=65536
