# Custom memory backend variant of the benchmark.
#
# libedhoc calls the application-supplied edhoc_mem_alloc / edhoc_mem_free
# instead of the stack or heap backend; this app implements them over a Zephyr
# k_heap (src/benchmark_mem_custom.c, compiled only under this backend). Apply
# with:
#   -DEXTRA_CONF_FILE=overlays/custom.conf
CONFIG_LIBEDHOC_MEM_BACKEND_CUSTOM=y
