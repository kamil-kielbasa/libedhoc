# Heap memory backend variant of the benchmark.
#
# libedhoc allocates its working buffers with k_calloc / k_free instead of the
# default stack (VLA) backend. Apply with:
#   -DEXTRA_CONF_FILE=overlays/heap.conf
CONFIG_LIBEDHOC_MEM_BACKEND_HEAP=y

# System heap pool backing k_calloc. A single handshake working set is a few
# KiB; the post-quantum and P-384 suites need the most head-room.
CONFIG_HEAP_MEM_POOL_SIZE=65536
