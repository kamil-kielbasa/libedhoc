# Cipher suite pqc_1: ML-KEM-512 / ML-DSA-44 / AES-CCM-16-128-128 / SHAKE256.
CONFIG_LIBEDHOC_CIPHER_SUITE_PQC_1_ENABLE=y

# ML-KEM-512 encapsulation key (800) / ciphertext (768); MAC buffer = SHAKE256
# output (64). No Diffie-Hellman (NIKE) key, but keep the ephemeral floor.
CONFIG_LIBEDHOC_MAX_LEN_OF_KEM_ENCAPSULATION_KEY=800
CONFIG_LIBEDHOC_MAX_LEN_OF_KEM_CIPHERTEXT=768
CONFIG_LIBEDHOC_MAX_LEN_OF_MAC=64

# ML-KEM-512 + ML-DSA-44 via liboqs; the SHAKE256 hash / KMAC256 KDF are built
# by libedhoc's XKCP Zephyr module (not PSA).
CONFIG_LIBOQS=y
CONFIG_LIBOQS_ENABLE_KEM_ML_KEM=y
CONFIG_LIBOQS_ENABLE_SIG_ML_DSA=y

# AES-CCM-16-128-128 AEAD.
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CCM=y
