name: CI / Zephyr

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  twister:
    name: Twister (native_sim benchmark)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:v0.29.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: libedhoc

      - name: Initialize West workspace
        run: west init -l libedhoc

      - name: Update West projects (with retry)
        uses: ./libedhoc/.github/actions/retry
        with:
          command: "west update --narrow -o=--depth=1"

      - name: Install Python dependencies
        run: |
          pip install -r zephyr/scripts/requirements-base.txt

      # -W: liboqs (third-party) isn't -Werror-clean; our code is checked by the
      # Linux matrix.
      - name: Twister - build + run libedhoc benchmark (native_sim)
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: host
        run: |
          ./zephyr/scripts/twister \
            --testsuite-root libedhoc/tests/zephyr \
            --platform native_sim \
            --outdir twister-out \
            --disable-warnings-as-errors \
            --inline-logs --verbose

      # Re-run each benchmark binary (one per cipher suite x memory backend, e.g.
      # cipher_suite_2.stack) for its libedhoc footprint and per-phase timing.
      - name: Benchmark footprint and timing
        if: always()
        run: |
          report=twister-out/flash_report.txt
          : > "$report"

          for exe in $(find twister-out -name zephyr.exe -path '*benchmark*' | sort); do
            # .../<scenario>/zephyr/zephyr.exe -> build directory and label
            build=$(dirname "$(dirname "$exe")")
            label=$(basename "$build" | sed 's/^libedhoc\.benchmark\.//')

            # The library archive, not the image: symbols named "edhoc" in the
            # image also belong to the benchmark application, its ztest nodes,
            # its allocator and its 32 KiB heap pool among them.
            lib=$(find "$build" -name libedhoc.a | head -1)
            test -n "$lib" || { echo "::error::${label}: no libedhoc.a"; exit 1; }

            {
              echo "=== ${label}: libedhoc footprint (bytes) ==="
              size -t "$lib" | tail -1
            } | tee -a "$report"

            timing="twister-out/benchmark_timing_${label}.json"
            "$exe" \
              | sed -n '/EDHOC_BENCHMARK_JSON_BEGIN/,/EDHOC_BENCHMARK_JSON_END/p' \
              | sed '1d;$d' > "$timing"
            test -s "$timing" || { echo "::error::${label}: no timing JSON"; exit 1; }

            echo "=== ${label}: timing ==="
            cat "$timing"
          done

      - name: Upload Twister + benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-twister-native_sim
          path: |
            twister-out/twister.xml
            twister-out/flash_report.txt
            twister-out/benchmark_timing_*.json

