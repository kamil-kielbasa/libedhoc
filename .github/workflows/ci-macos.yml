name: CI / macOS

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Apple Clang (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Fetch submodules (with retry)
        uses: ./.github/actions/retry
        with:
          command: "git submodule sync --recursive && git submodule update --init --recursive --depth=1"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native dependencies (with retry)
        uses: ./.github/actions/retry
        with:
          command: "HOMEBREW_NO_AUTO_UPDATE=1 brew install libxslt ninja"

      - name: Add Homebrew libxslt to PATH
        run: echo "$(brew --prefix libxslt)/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python -m pip install -r externals/mbedtls/tf-psa-crypto/scripts/driver.requirements.txt

      - name: Build and test
        run: bash scripts/ci.sh ci macos
