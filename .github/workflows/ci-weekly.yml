name: CI / Weekly

on:
  schedule:
    - cron: '0 8 * * 1'  # Mondays 09:00 CET (08:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-pipeline:
    name: Full CI pipeline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch submodules (with retry)
        uses: ./.github/actions/retry
        with:
          command: "git submodule sync --recursive && git submodule update --init --recursive --depth=1"

      - name: Install dependencies (with retry)
        uses: ./.github/actions/retry
        with:
          command: "sudo apt-get update && sudo apt-get install -y gcovr clang clang-tidy cppcheck xsltproc ninja-build valgrind"

      - name: Check matrix (anti-skip)
        run: bash scripts/ci.sh check-matrix

      - name: Full functional matrix
        run: bash scripts/ci.sh matrix

      - name: GCC + Coverage
        run: bash scripts/ci.sh coverage

      - name: Clang build + test
        run: bash scripts/ci.sh ci clang

      - name: ASan + UBSan
        run: bash scripts/ci.sh sanitizers

      - name: Valgrind
        run: bash scripts/ci.sh valgrind

      - name: Cppcheck
        run: bash scripts/ci.sh cppcheck

      - name: Clang-tidy
        run: bash scripts/ci.sh clang-tidy

      - name: Fuzz (300s per target)
        run: bash scripts/ci.sh fuzz 300
