name: CI / Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install apt dependencies (with retry)
        uses: ./.github/actions/retry
        with:
          command: "sudo apt-get update && sudo apt-get install -y graphviz"
      # apt's doxygen 1.9.8 mis-parses the anonymous unions in credentials.h
      # under -W; pin 1.17.0 from the GitHub release (doxygen.nl returns 415).
      - name: Install doxygen 1.17.0
        run: |
          curl -fsSL --retry 3 https://github.com/doxygen/doxygen/releases/download/Release_1_17_0/doxygen-1.17.0.linux.bin.tar.gz | sudo tar -xz -C /opt
          echo "/opt/doxygen-1.17.0/bin" >> "$GITHUB_PATH"
      - name: Install Python dependencies
        run: pip install -r doc/requirements.txt
      - name: Sphinx build
        run: sphinx-build -W -b html doc _build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/
          force_orphan: true
