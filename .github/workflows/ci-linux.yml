name: CI / Linux

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fast-fail tiers (needs:): cheap checks gate the expensive ones.
#   Format + Check matrix  ->  Build (smoke)  ->  matrix / Coverage /
#   Sanitizers / Static analysis / no-suites  ->  Valgrind / Fuzz
# (Zephyr, Docs and Sandbox are separate workflows.)

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install 'clang-format==16.0.6'
      - run: bash scripts/ci.sh format --check
      - run: bash scripts/ci.sh check-headers

  check-matrix:
    name: Check matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/retry
        with:
          command: "git submodule sync --recursive && git submodule update --init --recursive --depth=1"
      - uses: ./.github/actions/retry
        with:
          command: "sudo apt-get update && sudo apt-get install -y ninja-build"
      - run: bash scripts/ci.sh check-matrix

  build:
    name: Build (smoke)
    needs: [format, check-matrix]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/retry
        with:
          command: "git submodule sync --recursive && git submodule update --init --recursive --depth=1"
      - uses: ./.github/actions/retry
        with:
          command: "sudo apt-get update && sudo apt-get install -y xsltproc ninja-build"
      - run: bash scripts/ci.sh ci legacy

  matrix:
    name: ${{ matrix.preset }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset:
          - x25519_stack
          - x25519_heap
          - x25519_custom
          - p256_stack
          - p256_heap
          - p256_custom
          - p384_stack
          - p384_heap
          - p384_custom
          - mlkem512_stack
          - mlkem512_heap
          - mlkem512_custom
          - clang
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/retry
        with:
          command: "git submodule sync --recursive && git submodule update --init --recursive --depth=1"
      # clang-20 is not in the Ubuntu 24.04 repos. The version is pinned because
      # -Weverything makes every new clang diagnostic a build error.
      - uses: ./.github/actions/retry
        with:
          command: "wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh && sudo bash /tmp/llvm.sh 20"
      - uses: ./.github/actions/retry
        with:
          command: "sudo apt-get update && sudo apt-get install -y xsltproc ninja-build"
      - run: bash scripts/ci.sh ci ${{ matrix.preset }}

  # Non-blocking early warning: the same build with an unpinned clang, so a new
  # -Weverything diagnostic surfaces here instead of on the next version bump.
  clang-latest:
    name: Clang (unpinned, non-blocking)
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/retry
        with:
          command: "git submodule sync --recursive && git submodule update --init --recursive --depth=1"
      - uses: ./.github/actions/retry
        with:
          command: "wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh && sudo bash /tmp/llvm.sh"
      # llvm.sh installs clang-<N>; /usr/bin/clang still points at the distro
      # version, so put the newest one first on PATH.
      - name: Select the newest clang
        run: |
          ver=$(ls -1 /usr/bin/clang-* | grep -oE 'clang-[0-9]+$' | cut -d- -f2 |
                sort -n | tail -1)
          sudo ln -sf "/usr/bin/clang-${ver}" /usr/local/bin/clang
          clang --version
      - uses: ./.github/actions/retry
        with:
          command: "sudo apt-get update && sudo apt-get install -y xsltproc ninja-build"
      - run: bash scripts/ci.sh ci clang-latest

  coverage:
    name: Coverage
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/retry
        with:
          command: "git submodule sync --recursive && git submodule update --init --recursive --depth=1"
      - uses: ./.github/actions/retry
        with:
          command: "sudo apt-get update && sudo apt-get install -y gcovr xsltproc ninja-build"
      - run: bash scripts/ci.sh coverage
      - uses: codecov/codecov-action@v4
        with:
          files: build/coverage/report/coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  sanitizers:
    name: Sanitizers
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/retry
        with:
          command: "git submodule sync --recursive && git submodule update --init --recursive --depth=1"
      - uses: ./.github/actions/retry
        with:
          command: "sudo apt-get update && sudo apt-get install -y xsltproc ninja-build"
      - run: bash scripts/ci.sh sanitizers

  analysis:
    name: Static analysis
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/retry
        with:
          command: "git submodule sync --recursive && git submodule update --init --recursive --depth=1"
      - uses: ./.github/actions/retry
        with:
          command: "sudo apt-get update && sudo apt-get install -y cppcheck clang-tidy clang xsltproc ninja-build"
      - run: bash scripts/ci.sh cppcheck
      - run: bash scripts/ci.sh clang-tidy

  no-suites:
    name: Library (no cipher suites)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/retry
        with:
          command: "git submodule sync --recursive && git submodule update --init --recursive --depth=1"
      - uses: ./.github/actions/retry
        with:
          command: "sudo apt-get update && sudo apt-get install -y ninja-build"
      - run: bash scripts/ci.sh build no_cipher_suites libedhoc

  valgrind:
    name: Valgrind
    needs: matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/retry
        with:
          command: "git submodule sync --recursive && git submodule update --init --recursive --depth=1"
      - uses: ./.github/actions/retry
        with:
          command: "sudo apt-get update && sudo apt-get install -y valgrind xsltproc ninja-build"
      - run: bash scripts/ci.sh valgrind

  fuzz:
    name: Fuzz
    needs: matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/retry
        with:
          command: "git submodule sync --recursive && git submodule update --init --recursive --depth=1"
      - uses: ./.github/actions/retry
        with:
          command: "wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh && sudo bash /tmp/llvm.sh 20"
      - uses: ./.github/actions/retry
        with:
          command: "sudo apt-get update && sudo apt-get install -y ninja-build"
      - run: bash scripts/ci.sh fuzz 60
